<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Nana's EPUB Tools</title>
<style>
:root{
  --paper:#FBF6F2;
  --card:#FFFDFB;
  --ink:#2A1E24;
  --ink-soft:#7C6670;
  --ink-faint:#B9A6AC;
  --wine:#8C2F45;
  --wine-tint:#F7E8EA;
  --gold:#AD8A49;
  --gold-tint:#F1E7D3;
  --line:#E7D3CD;
  --r-lg:18px;
  --serif:'AppleMyungjo','Noto Serif KR','Nanum Myeongjo',Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  background:var(--paper);color:var(--ink);font-family:var(--sans);
  min-height:100vh;
}
.wrap{max-width:640px;margin:0 auto;padding:0 18px 60px;}

.hero{padding:48px 20px 26px;text-align:center;}
.hero-orn{width:7px;height:7px;border-radius:50%;background:var(--gold);margin:0 auto 14px;}
.hero-title{font-family:var(--serif);font-size:27px;font-weight:600;letter-spacing:.02em;margin:0 0 8px;}
.hero-rule{width:46px;height:1px;background:var(--gold);margin:0 auto 12px;opacity:.7;}
.hero-sub{font-size:13px;color:var(--ink-soft);margin:0;line-height:1.6;}

.card-list{display:flex;flex-direction:column;gap:14px;margin-top:10px;}

.tool-card{
  display:flex;align-items:center;gap:16px;
  background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);
  padding:18px 18px;text-decoration:none;color:inherit;
  transition:transform .12s,border-color .15s,box-shadow .15s;
}
.tool-card:active{transform:scale(.98);}
.tool-card:hover{border-color:var(--gold);box-shadow:0 4px 14px rgba(140,47,69,.08);}

.tool-icon{
  flex:0 0 auto;width:46px;height:46px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-family:var(--serif);font-size:19px;
  background:var(--wine-tint);color:var(--wine);
}
.tool-card.alt .tool-icon{background:var(--gold-tint);color:var(--gold);}

.tool-body{flex:1;min-width:0;}
.tool-name{font-family:var(--serif);font-size:16px;font-weight:600;margin:0 0 3px;color:var(--ink);}
.tool-desc{font-size:12.5px;color:var(--ink-soft);line-height:1.55;margin:0;}

.tool-arrow{flex:0 0 auto;font-size:16px;color:var(--ink-faint);}

.foot{text-align:center;font-size:11px;color:var(--ink-faint);margin-top:34px;line-height:1.7;}
</style>
</head>
<body>
<div class="wrap">

  <header class="hero">
    <div class="hero-orn"></div>
    <h1 class="hero-title">Nana's EPUB Tools</h1>
    <div class="hero-rule"></div>
    <p class="hero-sub">웹소설 텍본·EPUB 작업을 위한 도구 모음</p>
  </header>

  <!-- 도구 추가 시 이 아래에 .tool-card 블록만 복사해서 추가하면 됩니다 -->
  <div class="card-list">

    <a class="tool-card" href="./rf_epub_studio.html">
      <div class="tool-icon">✦</div>
      <div class="tool-body">
        <p class="tool-name">이펍 스튜디오</p>
        <p class="tool-desc">로맨스·로맨스판타지·판타지 텍본을 EPUB으로 — 회차 분리, 표지·삽화, 서식 커스터마이징</p>
      </div>
      <div class="tool-arrow">›</div>
    </a>

    <a class="tool-card alt" href="./epub_style_studio.html">
      <div class="tool-icon">❖</div>
      <div class="tool-body">
        <p class="tool-name">EPUB 스타일 스튜디오</p>
        <p class="tool-desc">완성된 EPUB을 열어 문단 단위로 박스·버튼·댓글·카톡 등 블록 서식을 입혀요</p>
      </div>
      <div class="tool-arrow">›</div>
    </a>

  </div>

  <div class="foot">개인 아카이빙용 웹 도구 모음</div>
</div>
</body>
</html>
